appId: com.mesbonnesadresses
name: 01_register
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible:
      id: "go-register"
    timeout: 15000
- tapOn:
    id: "go-register"

- tapOn:
    id: "register-name"
- inputText: "Testeur E2E"
- hideKeyboard

- tapOn:
    id: "register-email"
- inputRandomEmail
- hideKeyboard

- scrollUntilVisible:
    element:
      id: "register-password"
    direction: DOWN
- tapOn:
    id: "register-password"
- inputText: "secret123"
- hideKeyboard

- scrollUntilVisible:
    element:
      id: "register-confirm"
    direction: DOWN
- tapOn:
    id: "register-confirm"
- inputText: "secret123"
- hideKeyboard

- scrollUntilVisible:
    element:
      id: "register-submit"
    direction: DOWN
- tapOn:
    id: "register-submit"

- extendedWaitUntil:
    visible:
      id: "tab-map"
    timeout: 20000
- tapOn:
    id: "tab-profile"
- assertVisible: "Testeur E2E"
